[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-inbox"
version = "0.1.0"
description = "Activity-triggered mail triage that pings you only when it matters, and learns from your corrections."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hermes-inbox = "hermes_inbox.cli:main"

[tool.setuptools]
packages = ["hermes_inbox", "hermes_inbox.sources", "hermes_inbox.notify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
