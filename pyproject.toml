[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expression
build-backend = "setuptools.build_meta"

[project]
name = "hermes-inbox"
version = "0.1.0"
description = "Activity-triggered mail triage that pings you only when it matters, and learns from your corrections."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
# Lint and type tools are pinned exactly: a new release that adds a rule
# must not turn CI red on a commit that did not change.
dev = ["pytest>=8", "ruff==0.16.10", "mypy==2.4.0"]
# Optional on purpose: there is no keychain on a headless server, which is where
# this most often runs, so the agent must work without it.
keyring = ["keyring>=25"]

[project.scripts]
hermes-inbox = "hermes_inbox.cli:main"

[tool.setuptools]
packages = ["hermes_inbox", "hermes_inbox.sources", "hermes_inbox.notify"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Explicit rather than the tool's default set, which moves between releases.
# RUF001-003: the CLI and docs use typographic marks (–, ·, −) on purpose.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
files = ["hermes_inbox"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Optional dependency with no type stubs; see secrets.py.
module = ["keyring", "keyring.*"]
ignore_missing_imports = true
